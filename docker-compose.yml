version: '3.1'

services:
  node:
    build: ./dockerfiles/
    environment:
      ANIME_DB_USER_NAME: ${ANIME_DB_USER_NAME}
      ANIME_DB_PASS: ${ANIME_DB_PASS}
      ANIME_DB_HOST: ${ANIME_DB_HOST:-mariadb}
      ANIME_SHOBOI_CALENDAR_USERNAME: ${ANIME_SHOBOI_CALENDAR_USERNAME}
      ANIME_GOOGLE_CLIENT_ID: ${ANIME_GOOGLE_CLIENT_ID}
      ANIME_GOOGLE_ALLOWED_EMAIL: ${ANIME_GOOGLE_ALLOWED_EMAIL}
      ANIME_SESSION_SECRET: ${ANIME_SESSION_SECRET}
    volumes:
      - ./node_server:/server
    ports:
      - "8000:3333"
    links:
      - mariadb
    working_dir: /server
    command: [sh, -c, npm install && npm start]

  mariadb:
    image: mariadb:10.5
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    restart: always
    environment:
      MYSQL_DATABASE: anime
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
