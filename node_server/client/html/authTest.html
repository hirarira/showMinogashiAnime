<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>認証テスト（Google ID トークン）</title>
    <style>
      body { font-family: sans-serif; margin: 24px; line-height: 1.6; }
      pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; }
      button { padding: 6px 14px; margin: 8px 0; }
      .ok { color: #0a7d28; font-weight: bold; }
      .ng { color: #c00; font-weight: bold; }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <h1>認証テスト</h1>
    <p>
      Google でサインインすると ID トークンが発行されるので、それを使って
      <code>GET ./api/authTest</code> を叩き、サーバー側の検証結果を表示します。<br>
      許可アカウント（hirarira617）なら 200、それ以外は 401 になるはずです。
    </p>

    <div id="signin-button"></div>
    <p id="signin-error" class="ng"></p>

    <hr>
    <button id="no-token-button" type="button">トークンなしで /authTest を叩く（401 の確認）</button>

    <h2>結果</h2>
    <p id="result-status">まだ実行していません</p>
    <pre id="result-body"></pre>

    <h2>発行された ID トークンの内容（参考・ブラウザ側でのデコード）</h2>
    <pre id="token-payload">未サインイン</pre>

    <script>
      // クライアント ID は公開情報（フロントに埋め込む前提の値）
      const GOOGLE_CLIENT_ID = '210658911439-j9dplksco3uv1mj6614536c4vdo1tu9a.apps.googleusercontent.com';

      function showResult(status, text) {
        const statusEl = document.getElementById('result-status');
        statusEl.textContent = 'HTTP ' + status;
        statusEl.className = status === 200 ? 'ok' : 'ng';
        document.getElementById('result-body').textContent = text;
      }

      async function callAuthTest(idToken) {
        const headers = {};
        if (idToken) {
          headers['Authorization'] = 'Bearer ' + idToken;
        }
        try {
          const res = await fetch('./api/authTest', { headers: headers });
          showResult(res.status, await res.text());
        } catch (e) {
          showResult('-', String(e));
        }
      }

      function decodePayload(jwt) {
        try {
          const base64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          const json = decodeURIComponent(atob(base64).split('').map(function (c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          return JSON.stringify(JSON.parse(json), null, 2);
        } catch (e) {
          return 'デコード失敗: ' + e;
        }
      }

      function onCredential(response) {
        const idToken = response.credential;
        document.getElementById('token-payload').textContent = decodePayload(idToken);
        callAuthTest(idToken);
      }

      window.addEventListener('load', function () {
        if (!window.google || !google.accounts || !google.accounts.id) {
          document.getElementById('signin-error').textContent =
            'Google のサインイン用スクリプトを読み込めませんでした。';
          return;
        }
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: onCredential
        });
        google.accounts.id.renderButton(
          document.getElementById('signin-button'),
          { theme: 'outline', size: 'large', text: 'signin_with' }
        );
      });

      document.getElementById('no-token-button').addEventListener('click', function () {
        callAuthTest(null);
      });
    </script>
  </body>
</html>
